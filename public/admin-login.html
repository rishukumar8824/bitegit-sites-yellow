<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bitegit Admin Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: '#22c55e',
              panel: '#0f172a'
            }
          }
        }
      };
    </script>
  </head>
  <body class="min-h-full bg-slate-950 text-slate-100">
    <main class="min-h-screen flex items-center justify-center px-4 py-8">
      <section class="w-full max-w-md rounded-2xl border border-slate-800 bg-slate-900/70 backdrop-blur p-6 sm:p-8 shadow-2xl shadow-slate-950/60">
        <header class="mb-6">
          <p class="text-xs uppercase tracking-[0.2em] text-slate-400">Bitegit Exchange</p>
          <h1 class="mt-2 text-2xl font-semibold">Admin Control Panel</h1>
          <p class="mt-2 text-sm text-slate-400">Secure login for Super, Finance, Support and Compliance admins.</p>
        </header>

        <form id="adminLoginForm" class="space-y-4" novalidate>
          <div>
            <label for="identifier" class="block text-sm text-slate-300 mb-1">Email or Username</label>
            <input
              id="identifier"
              name="identifier"
              type="text"
              placeholder="admin or admin@admin.local"
              autocomplete="username"
              class="w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 text-sm text-slate-100 outline-none transition focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20"
              required
            />
          </div>

          <div>
            <label for="password" class="block text-sm text-slate-300 mb-1">Password</label>
            <input
              id="password"
              name="password"
              type="password"
              placeholder="Enter admin password"
              autocomplete="current-password"
              class="w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 text-sm text-slate-100 outline-none transition focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20"
              required
            />
          </div>

          <div>
            <label for="otpCode" class="block text-sm text-slate-300 mb-1">2FA Code (optional)</label>
            <input
              id="otpCode"
              name="otpCode"
              type="text"
              placeholder="6-digit code if enabled"
              inputmode="numeric"
              class="w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 text-sm text-slate-100 outline-none transition focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20"
            />
          </div>

          <button
            id="submitBtn"
            type="submit"
            class="w-full rounded-xl bg-emerald-500 px-4 py-3 text-sm font-semibold text-slate-950 transition hover:bg-emerald-400 active:scale-[0.99]"
          >
            Sign In
          </button>

          <p id="loginMessage" class="min-h-[20px] text-sm"></p>
        </form>
      </section>
    </main>

    <script src="/admin-login.js"></script>
  <!-- Cookie Consent Popup -->
<div id="cookieConsent" style="display:none;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:999999;background:#1a1a2e;border:1px solid #2a2a4a;border-radius:14px;padding:18px 24px;box-shadow:0 8px 32px rgba(0,0,0,0.5);max-width:480px;width:calc(100% - 40px);display:flex;align-items:center;gap:16px;flex-wrap:wrap;">
  <div style="flex:1;min-width:200px;">
    <p style="margin:0 0 4px;color:#fff;font-size:14px;font-weight:600;">We use cookies 🍪</p>
    <p style="margin:0;color:#aaa;font-size:12px;line-height:1.5;">We use cookies to improve your experience, analyze traffic, and personalize content. By clicking Accept, you agree to our use of cookies.</p>
  </div>
  <div style="display:flex;gap:10px;flex-shrink:0;">
    <button onclick="cookieDecline()" style="padding:8px 16px;border-radius:8px;border:1px solid #444;background:transparent;color:#aaa;font-size:13px;cursor:pointer;">Decline</button>
    <button onclick="cookieAccept()" style="padding:8px 20px;border-radius:8px;border:none;background:linear-gradient(135deg,#00b8d4,#0070f3);color:#fff;font-size:13px;font-weight:600;cursor:pointer;">Accept</button>
  </div>
</div>
<script>
(function() {
  var consent = localStorage.getItem('cookieConsent');
  if (!consent) {
    setTimeout(function() {
      var el = document.getElementById('cookieConsent');
      if (el) el.style.display = 'flex';
    }, 1200);
  }
})();
function cookieAccept() {
  localStorage.setItem('cookieConsent', 'accepted');
  var el = document.getElementById('cookieConsent');
  if (el) el.style.display = 'none';
}
function cookieDecline() {
  localStorage.setItem('cookieConsent', 'declined');
  var el = document.getElementById('cookieConsent');
  if (el) el.style.display = 'none';
}
</script>
</body>
</html>
