<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bitegit Admin Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: '#22c55e',
              panel: '#0f172a'
            }
          }
        }
      };
    </script>
  </head>
  <body class="min-h-full bg-slate-950 text-slate-100">
    <main class="min-h-screen flex items-center justify-center px-4 py-8">
      <section class="w-full max-w-md rounded-2xl border border-slate-800 bg-slate-900/70 backdrop-blur p-6 sm:p-8 shadow-2xl shadow-slate-950/60">
        <header class="mb-6">
          <p class="text-xs uppercase tracking-[0.2em] text-slate-400">Bitegit Exchange</p>
          <h1 class="mt-2 text-2xl font-semibold">Admin Control Panel</h1>
          <p class="mt-2 text-sm text-slate-400">Secure login for Super, Finance, Support and Compliance admins.</p>
        </header>

        <form id="adminLoginForm" class="space-y-4" novalidate>
          <div>
            <label for="identifier" class="block text-sm text-slate-300 mb-1">Email or Username</label>
            <input
              id="identifier"
              name="identifier"
              type="text"
              placeholder="admin or admin@admin.local"
              autocomplete="username"
              class="w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 text-sm text-slate-100 outline-none transition focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20"
              required
            />
          </div>

          <div>
            <label for="password" class="block text-sm text-slate-300 mb-1">Password</label>
            <input
              id="password"
              name="password"
              type="password"
              placeholder="Enter admin password"
              autocomplete="current-password"
              class="w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 text-sm text-slate-100 outline-none transition focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20"
              required
            />
          </div>

          <div>
            <label for="otpCode" class="block text-sm text-slate-300 mb-1">2FA Code (optional)</label>
            <input
              id="otpCode"
              name="otpCode"
              type="text"
              placeholder="6-digit code if enabled"
              inputmode="numeric"
              class="w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 text-sm text-slate-100 outline-none transition focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20"
            />
          </div>

          <button
            id="submitBtn"
            type="submit"
            class="w-full rounded-xl bg-emerald-500 px-4 py-3 text-sm font-semibold text-slate-950 transition hover:bg-emerald-400 active:scale-[0.99]"
          >
            Sign In
          </button>

          <p id="loginMessage" class="min-h-[20px] text-sm"></p>
        </form>
      </section>
    </main>

    <script src="/admin-login.js"></script>
  <!-- Cookie Consent Popup -->
<style>
#cookieConsent {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 999999;
  background: #18181f;
  border: 1px solid #2a2a3a;
  border-radius: 16px;
  padding: 22px 22px 18px;
  box-shadow: 0 8px 40px rgba(0,0,0,0.6);
  width: 320px;
  transform: translateY(140%);
  opacity: 0;
  transition: transform 0.45s cubic-bezier(0.34,1.56,0.64,1), opacity 0.35s ease;
  pointer-events: none;
}
#cookieConsent.cc-show {
  transform: translateY(0);
  opacity: 1;
  pointer-events: all;
}
#cookieConsent p { margin: 0; }
.cc-title { color: #fff; font-size: 14px; font-weight: 600; margin-bottom: 8px !important; }
.cc-text  { color: #999; font-size: 12px; line-height: 1.6; margin-bottom: 16px !important; }
.cc-btn {
  display: block; width: 100%; padding: 11px;
  border-radius: 10px; font-size: 13px; font-weight: 600;
  cursor: pointer; text-align: center; margin-bottom: 10px;
  border: none; transition: opacity 0.2s;
}
.cc-btn:hover { opacity: 0.85; }
.cc-accept { background: #fff; color: #000; }
.cc-decline { background: #252530; color: #ccc; border: 1px solid #333 !important; }
</style>
<div id="cookieConsent">
  <p class="cc-title">Cookies are used to optimize and personalize your website experience.</p>
  <p class="cc-text">You can manage your cookie preferences and view the <a href="#" style="color:#00b8d4;text-decoration:none;">Cookies Policy</a>.</p>
  <button class="cc-btn cc-accept" onclick="cookieAccept()">Accept all cookies</button>
  <button class="cc-btn cc-decline" onclick="cookieDecline()">Reject all</button>
</div>
<script>
(function() {
  if (!localStorage.getItem('cookieConsent')) {
    setTimeout(function() {
      var el = document.getElementById('cookieConsent');
      if (el) el.classList.add('cc-show');
    }, 1200);
  }
})();
function cookieAccept() {
  localStorage.setItem('cookieConsent', 'accepted');
  var el = document.getElementById('cookieConsent');
  if (el) { el.style.transform='translateY(140%)'; el.style.opacity='0'; }
}
function cookieDecline() {
  localStorage.setItem('cookieConsent', 'declined');
  var el = document.getElementById('cookieConsent');
  if (el) { el.style.transform='translateY(140%)'; el.style.opacity='0'; }
}
</script>
</body>
</html>
